<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <style>
        body{text-align:center;font-family:Arial, Helvetica, sans-serif;background:white;padding-top:30px;}
        .card{
            width:80px;height:80px;background:cyan;color:white;font-size:30px;margin:8px;border-radius:10px;cursor:pointer;transition:0.3s;
        }
    </style>
</head>
<body>
    <h2 id="status">Find the Match</h2>
    <div id="game"></div>
    <script>
        let items=["🐱","🐶","🐱","🐶"];
        items.sort(()=>Math.random()-0.5);
        let first=null;
        items.forEach(i=>{
            let c=document.createElement("div");
            c.className="card";
            c.dataset.value=i;
            c.onclick=()=>reveal(c);
            c.innerText="?";
            game.appendChild(c);
        });
        function reveal(c){
            c.innerText=c.dataset.value;
            if(!first){first=c;}
            else{
                if(first.dataset.value===c.dataset.value && first!==c){
                    first.style.background="green";
                    c.style.background="green";
                    status.innerText="Matched!"
                }else{
                    let a=first,b=c;
                    setTimeout(()=>{a.innerText="?";b.innerText="?"},600);
                    status.innerText="Try Again!";
                }
                first=null;
            }
        }
    </script>
</body>
</html>
