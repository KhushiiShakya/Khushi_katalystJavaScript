<!DOCTYPE html>
<html lang="en">
    <head>
      <title>Rock Paper Scissors</title>
      <style>
      *{margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:sans-serif;
      }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#050137;
            color: rgb(255, 255, 255);
        }
        .game-container{
            text-align: center;
            background:#172a45;
            padding:30px;
            border-radius:10px;
            width:380px;
            box-shadow:0 0 10px rgba(221, 212, 212, 0.2);
            animation: fadeIn 6s ease-in-out;
        }
        h2{
            margin-bottom:20px;
        }
        .buttons button{
            font-size:30px;
            margin:10px;
            cursor:pointer;padding: 12px;
            border:none;
            border-radius: 10px;
            transition: 0.3s;
            background: #ffffff20;
            color: rgb(255, 255, 255);
                }
        .buttons button:hover{
            transform: scale(1.2) rotate(5deg);
        }
        .result-box{
            margin-top:20px;
            font-size:20px;
        }
        #winner{
           min-height: 25px;
            margin-top:10px;
            font-weight:bold;
            animation: pop 0.4s ease;
        }
        .score{
            margin-top:20px;
            font-size:18px;
        }
        @keyframes pop{
            0%{transform: scale(0.5);opacity:0;}
            100%{transform: scale(1);opacity:1;}
        }
        @keyframes fade{
            0%{opacity:0;transform: translate(15px);}
            100%{opacity:1; transform: translate(0);}
        }
        </style>
    </head>
    <body>
        <div class="game-container">
            <h2>Rock • Paper • Scissors</h2>
            <p>Choose your move here 👇</p>
            <div class="buttons">
                <button onclick="play('rock')">✊</button>
                <button onclick="play('paper')">✋</button>
                <button onclick="play('scissors')">✌️</button>
             <div class="result-box">
                <div id="user-choice">Your Choice: </div>
                <div id="computer-choice">Computer's Choice: </div>
                <div id="winner"></div>
            </div>
            <div class="score">
                Score - You: <span id="user-score">0</span> | Computer: <span id="computer-score">0</span>
            </div>
        </div>
        <script>
            let userScore = 0;
            let computerScore = 0;
            function play(userChoice) {
                const choices = ['rock', 'paper', 'scissors'];
                const computerChoice = choices[Math.floor(Math.random() * 3)];
                document.getElementById('user-choice').innerText = `Your Choice: ${userChoice}`;
                document.getElementById('computer-choice').innerText = `Computer's Choice: ${computerChoice}`;
                let winner = determineWinner(userChoice, computerChoice);
                                document.getElementById('winner').innerText = winner;
                if (winner === 'You Win!🥳') {
                    userScore++;
                } else if (winner === 'Computer Wins!😥') {
                    computerScore++;
                }
                document.getElementById('user-score').innerText = userScore;
                document.getElementById('computer-score').innerText = computerScore;
            }
            function determineWinner(user, computer) {
                if (user === computer) {
                    return "It's a Draw!😐";
                }
                if (
                    (user === 'rock' && computer === 'scissors') ||
                    (user === 'paper' && computer === 'rock') ||
                    (user === 'scissors' && computer === 'paper')
                ) {
                    return 'You Win!🥳';
                } else {
                    return 'Computer Wins!😥';
                }
    }
        
    </script>
</body>
</html>
