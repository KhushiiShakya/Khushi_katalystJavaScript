<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        body{text-align:center;font-family:sans-serif;margin-top:80px;background:beige}
        h1{font-size:50px; color:brown}
        button{padding:10px 20px; margin:5px; font-size:16px; color:black}
    </style>
</head>
<body>
    <h1 id="count">0</h1>
    <button onclick="increase()">+</button>
    <button onclick="reset()">Reset</button>
    <button onclick="decrease()">-</button>
    <script>
        let count=0;
        function increase(){
            count++;
            document.getElementById("count").innerText = count;
        }
        function decrease(){
            count--;
            document.getElementById("count").innerText=count;
        }
        function reset(){
            count=0;
            document.getElementById("count").innerText = count;
        }
    </script>
</body>
</html>
